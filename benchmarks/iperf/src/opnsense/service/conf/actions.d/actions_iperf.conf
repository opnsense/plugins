[start]
command:/usr/local/etc/rc.d/iperf start
parameters:
type:script
message:starting iperf daemon

[stop]
command:/usr/local/etc/rc.d/iperf stop
parameters:
type:script
message:stopping iperf daemon

[restart]
command:/usr/local/etc/rc.d/iperf restart
parameters:
type:script
message:restarting iperf daemon

[status]
command:/usr/local/etc/rc.d/iperf status
parameters:
type:script_output
message:request iperf daemon status

[client.list]
command:/usr/local/opnsense/scripts/iperf/client.py list
parameters:
type:script_output
message:list iperf client jobs

[client.start]
command:/usr/local/opnsense/scripts/iperf/client.py
parameters: --job %s start
type:script_output
message:start iperf client job %s

[client.remove]
command:/usr/local/opnsense/scripts/iperf/client.py
parameters: --job %s remove
type:script_output
message:remove iperf client job %s
