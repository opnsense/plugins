[start]
command:/usr/local/etc/rc.d/checkmkagent start
parameters:
type:script
message:starting Checkmk agent

[stop]
command:/usr/local/etc/rc.d/checkmkagent stop
parameters:
type:script
message:stopping Checkmk agent

[restart]
command:/usr/local/etc/rc.d/checkmkagent restart
parameters:
type:script
message:restarting Checkmk agent

[status]
command:/usr/local/etc/rc.d/checkmkagent status
errors:no
parameters:
type:script_output
message:requesting Checkmk agent status
