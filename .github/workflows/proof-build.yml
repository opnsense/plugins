name: Build os-bind-rp release artifact

on:
  workflow_dispatch:
    inputs:
      series:
        description: OPNsense release series to build (<major>.<minor>)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      series: ${{ steps.release.outputs.series }}
      release_ref: ${{ steps.release.outputs.release_ref }}
    steps:
      - name: Require master control plane
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "release builds must be dispatched from master" >&2
            exit 1
          fi
      - name: Validate requested release series
        id: release
        shell: bash
        env:
          RELEASE_SERIES: ${{ inputs.series }}
        run: |
          series="${RELEASE_SERIES:?missing series}"
          if ! printf '%s\n' "$series" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "series must use <major>.<minor> form" >&2
            exit 1
          fi
          release_ref="refs/heads/release/bind-rp/$series"
          {
            printf 'series=%s\n' "$series"
            printf 'release_ref=%s\n' "$release_ref"
          } >> "$GITHUB_OUTPUT"

  profile:
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      series: ${{ steps.metadata.outputs.series }}
      freebsd_release: ${{ steps.metadata.outputs.freebsd_release }}
      source_commit: ${{ steps.metadata.outputs.source_commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read release branch profile
        id: metadata
        shell: bash
        env:
          RELEASE_SERIES: ${{ needs.validate.outputs.series }}
        run: |
          series="${RELEASE_SERIES:?missing series}"
          release_ref="refs/heads/release/bind-rp/$series"
          git fetch --no-tags origin "$release_ref:refs/remotes/origin/build-source"
          source_commit=$(git rev-parse refs/remotes/origin/build-source)

          metadata_path="$RUNNER_TEMP/upstream.json"
          git show "$source_commit:.resolver-plugins/upstream.json" > "$metadata_path"
          metadata_field() {
            python3 tools/ci/metadata_profile.py "$metadata_path" "$series" "$1"
          }

          validated_series=$(metadata_field series)
          freebsd_release=$(metadata_field freebsd_release)
          if [[ "$validated_series" != "$series" ]]; then
            echo "validated metadata series does not match requested series" >&2
            exit 1
          fi
          {
            printf 'series=%s\n' "$validated_series"
            printf 'freebsd_release=%s\n' "$freebsd_release"
            printf 'source_commit=%s\n' "$source_commit"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: profile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Materialize profiled release source
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.profile.outputs.source_commit }}
        run: |
          source_commit="${SOURCE_COMMIT:?missing source commit}"
          git fetch --no-tags origin "$source_commit"
          git checkout "$source_commit" -- .resolver-plugins/upstream.json Mk dns/bind
          git cat-file -e "$source_commit:Mk/devel.mk" 2>/dev/null || rm -f Mk/devel.mk
      - name: Build in declared FreeBSD release
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          usesh: true
          disable-cache: true
          copyback: true
          run: |
            series='${{ needs.profile.outputs.series }}'
            RP_UPSTREAM_METADATA=.resolver-plugins/upstream.json \
              SOURCE_COMMIT='${{ needs.profile.outputs.source_commit }}' \
              tools/ci/build-os-bind-rp.sh "$series" "artifacts/$series"
      - name: Upload release build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: os-bind-rp-${{ needs.profile.outputs.series }}
          path: artifacts/${{ needs.profile.outputs.series }}
          retention-days: 7
