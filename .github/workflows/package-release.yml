name: Publish os-bind-rp package release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: development builds a PR pre-release; production publishes a release channel
        required: true
        type: choice
        options: [development, production]
      series:
        description: OPNsense release series (<major>.<minor>)
        required: true
        type: string
      pull_number:
        description: Required for development builds; optional production provenance reference
        required: false
        type: string
  pull_request_target:
    types: [closed]
    branches: ["release/bind-rp/**"]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install CI test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'
      - name: Run CI helper tests
        run: python -m pytest -q .github/ci/ci-tests

  select:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      series: ${{ steps.select.outputs.series }}
      source_ref: ${{ steps.select.outputs.source_ref }}
      prerelease_tag: ${{ steps.select.outputs.prerelease_tag }}
    steps:
      - id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SERIES: ${{ inputs.series }}
          INPUT_PULL_NUMBER: ${{ inputs.pull_number }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            mode="$INPUT_MODE"
            series="$INPUT_SERIES"
            if [[ "$mode" == development ]]; then
              [[ "$INPUT_PULL_NUMBER" =~ ^[1-9][0-9]*$ ]]
              source_ref="refs/pull/$INPUT_PULL_NUMBER/head"
              prerelease_tag="pr-$INPUT_PULL_NUMBER-$series"
            else
              source_ref="refs/heads/release/bind-rp/$series"
              prerelease_tag=""
            fi
          else
            mode=production
            series="${PR_BASE#release/bind-rp/}"
            source_ref="refs/heads/$PR_BASE"
            prerelease_tag=""
          fi
          [[ "$mode" == development || "$mode" == production ]]
          [[ "$series" =~ ^[0-9]+\.[0-9]+$ ]]
          {
            printf 'mode=%s\n' "$mode"
            printf 'series=%s\n' "$series"
            printf 'source_ref=%s\n' "$source_ref"
            printf 'prerelease_tag=%s\n' "$prerelease_tag"
          } >> "$GITHUB_OUTPUT"

  profile:
    needs: select
    runs-on: ubuntu-24.04
    outputs:
      source_commit: ${{ steps.profile.outputs.source_commit }}
      freebsd_release: ${{ steps.profile.outputs.freebsd_release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: profile
        shell: bash
        env:
          SOURCE_REF: ${{ needs.select.outputs.source_ref }}
          SERIES: ${{ needs.select.outputs.series }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_REF:refs/remotes/origin/package-source"
          source_commit=$(git rev-parse refs/remotes/origin/package-source)
          git show "$source_commit:.resolver-plugins/upstream.json" > "$RUNNER_TEMP/upstream.json"
          freebsd_release=$(python3 .github/ci/metadata_profile.py "$RUNNER_TEMP/upstream.json" "$SERIES" freebsd_release)
          printf 'source_commit=%s\nfreebsd_release=%s\n' "$source_commit" "$freebsd_release" >> "$GITHUB_OUTPUT"

  build:
    needs: [select, profile, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RP_BIND920_CHANNEL_URL: https://github.com/${{ github.repository }}/releases/download/pkg-${{ needs.select.outputs.series }}-bind920
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Materialize selected release source
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.profile.outputs.source_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_COMMIT"
          git checkout "$SOURCE_COMMIT" -- .resolver-plugins/upstream.json Mk dns/bind
          git cat-file -e "$SOURCE_COMMIT:Mk/devel.mk" 2>/dev/null || rm -f Mk/devel.mk
      - name: Build package
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: RP_BIND920_CHANNEL_URL
          usesh: true
          disable-cache: true
          copyback: true
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3
            series='${{ needs.select.outputs.series }}'
            mode='${{ needs.select.outputs.mode }}'
            output="artifacts/$series"
            if [ "$mode" = development ]; then
              devel=RP_PLUGIN_DEVEL=yes
            else
              devel=
            fi
            set +e
            env $devel RP_UPSTREAM_METADATA=.resolver-plugins/upstream.json SOURCE_COMMIT='${{ needs.profile.outputs.source_commit }}' .github/ci/build-os-bind-rp.sh "$series" "$output"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -ne 3 ]; then
              exit "$status"
            fi
            RP_UPSTREAM_METADATA=.resolver-plugins/upstream.json SOURCE_COMMIT='${{ needs.profile.outputs.source_commit }}' .github/ci/build-bind920.sh "$series" "$output"
            [ -f "$output/bind920-9.20.26_1.pkg" ] || { echo 'BIND fallback is required but did not build' >&2; exit 1; }
            env $devel RP_BIND920_FALLBACK=yes RP_UPSTREAM_METADATA=.resolver-plugins/upstream.json SOURCE_COMMIT='${{ needs.profile.outputs.source_commit }}' .github/ci/build-os-bind-rp.sh "$series" "$output"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: os-bind-rp-build-${{ needs.select.outputs.mode }}-${{ needs.select.outputs.series }}
          path: artifacts/${{ needs.select.outputs.series }}
          retention-days: 7

  publish-development:
    if: needs.select.outputs.mode == 'development'
    needs: [select, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: os-bind-rp-build-development-${{ needs.select.outputs.series }}
          path: artifacts/${{ needs.select.outputs.series }}
      - name: Publish development pre-release
        shell: bash
        env:
          TAG: ${{ needs.select.outputs.prerelease_tag }}
          SERIES: ${{ needs.select.outputs.series }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "os-bind-rp development $TAG" --prerelease --notes "Development build for pull request testing." || true
          gh release upload "$TAG" "artifacts/$SERIES"/* --clobber --repo "$GITHUB_REPOSITORY"

  sign:
    if: needs.select.outputs.mode == 'production'
    needs: [select, profile, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/heads/master
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: os-bind-rp-build-production-${{ needs.select.outputs.series }}
          path: artifacts/${{ needs.select.outputs.series }}
      - name: Sign package repository
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d
        env:
          RP_PKG_SIGNING_KEY: ${{ secrets.RP_PKG_SIGNING_KEY }}
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: RP_PKG_SIGNING_KEY
          usesh: true
          disable-cache: true
          copyback: true
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3
            umask 077
            key=.rp-pkg-signing-key.pem
            trap 'rm -f "$key"' EXIT HUP INT TERM
            printf '%s' "$RP_PKG_SIGNING_KEY" | base64 -d > "$key"
            output="artifacts/${{ needs.select.outputs.series }}"
            grep -Fqx 'source_commit=${{ needs.profile.outputs.source_commit }}' "$output/build-metadata.txt"
            mkdir -p "$output/repository" "$output/archive-input" "$output/bind920-input"
            python3 .github/ci/release_channel.py stage-plugin --packages-directory "$output" --output "$output/repository/latest" --private-key "$key"
            set +e
            python3 .github/ci/release_channel.py collect-plugin-archive --channel-url "https://github.com/$GITHUB_REPOSITORY/releases/download/pkg-${{ needs.select.outputs.series }}-archive" --public-key docs/package-repository/resolver-plugins.pub --output "$output/archive-input"
            archive_status=$?
            set -e
            [ "$archive_status" -eq 0 ] || [ "$archive_status" -eq 3 ] || exit "$archive_status"
            cp "$output"/os-bind-rp-*.pkg "$output/build-metadata.txt" "$output/archive-input/"
            python3 .github/ci/release_channel.py stage-plugin --packages-directory "$output/archive-input" --output "$output/repository/archive" --private-key "$key"
            set -- "$output"/bind920-*.pkg
            if [ -f "$1" ]; then
              python3 .github/ci/release_channel.py stage-bind920 --packages-directory "$output" --output "$output/repository/bind920" --private-key "$key"
            else
              set +e
              python3 .github/ci/release_channel.py collect-bind920 --channel-url "https://github.com/$GITHUB_REPOSITORY/releases/download/pkg-${{ needs.select.outputs.series }}" --public-key docs/package-repository/resolver-plugins.pub --output "$output/bind920-input"
              bind920_status=$?
              set -e
              [ "$bind920_status" -eq 0 ] || [ "$bind920_status" -eq 3 ] || exit "$bind920_status"
              if [ "$bind920_status" -eq 0 ]; then
                python3 .github/ci/release_channel.py stage-bind920 --packages-directory "$output/bind920-input" --output "$output/repository/bind920" --private-key "$key"
              fi
            fi
            openssl pkey -in "$key" -pubout -out "$output/resolver-plugins.pub"
            for repository in "$output"/repository/*; do
              cp "$output/resolver-plugins.pub" "$repository/"
            done
            rm -f "$key"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: os-bind-rp-production-repository-${{ needs.select.outputs.series }}
          path: artifacts/${{ needs.select.outputs.series }}/repository
          retention-days: 7

  publish:
    if: needs.select.outputs.mode == 'production'
    needs: [select, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/heads/master
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: os-bind-rp-production-repository-${{ needs.select.outputs.series }}
          path: artifacts/${{ needs.select.outputs.series }}/repository
      - name: Publish production package channel
        shell: bash
        env:
          SERIES: ${{ needs.select.outputs.series }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="artifacts/$SERIES/repository"
          channels=(--channel "pkg-$SERIES-archive=$root/archive")
          if [ -d "$root/bind920" ]; then
            channels+=(--channel "pkg-$SERIES-bind920=$root/bind920")
          fi
          channels+=(--channel "pkg-$SERIES=$root/latest")
          python3 .github/ci/release_channel.py publish-channels --repository "$GITHUB_REPOSITORY" --recovery "$RUNNER_TEMP/recovery" "${channels[@]}"
