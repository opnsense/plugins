{% if not helpers.empty('OPNsense.QFeedsConnector.general.apikey') %}
[api]
key={{OPNsense.QFeedsConnector.general.apikey}}
{% endif %}

{% if not helpers.empty('OPNsense.QFeedsConnector.firewall.alias') %}
{% for tbl in helpers.toList('OPNsense.QFeedsConnector.firewall.alias') %}
[pf-table-{{loop.index}}]
name=__qfeeds_{{tbl.name}}
include={{tbl.include}}
exclude={{tbl.exclude}}
{% endfor %}

{% endif %}
