###################################################################
# Local syslog-ng configuration [caddy].
###################################################################
# DO NOT EDIT THIS FILE -- OPNsense auto-generated file
#
# Define Unix socket source for Caddy
source s_caddy {
    # this is where the first round of logs comes in (NOT in syslog format)
    unix-dgram(
        "/var/run/caddy/log.sock"
        program-override("caddy")
        flags(no-parse)
    );
    # Additionally capture stdout/stderr written by the rc script
    # and by Caddy itself in case the socket is temporarily unavailable
    file(
        "/var/log/caddy/caddy.log"
        program-override("caddy")
        flags(no-parse)
        default-priority(info)
    );
};

# Parser for Caddy log levels
parser p_caddy_levels {
    channel {
        rewrite {
            set-severity("7" condition(message("(?i).*debug.*")));  # DEBUG -> Debug
            set-severity("6" condition(message("(?i).*info.*")));   # INFO -> Informational
            set-severity("4" condition(message("(?i).*warn.*")));   # WARN -> Warning
            set-severity("3" condition(message("(?i).*error.*")));  # ERROR -> Error
            set-severity("2" condition(message("(?i).*panic.*")));  # PANIC -> Critical
            set-severity("1" condition(message("(?i).*fatal.*")));  # FATAL -> Alert
        };
    };
};

# Destination for Caddy logs
destination d_local_caddy_feedback {
    unix-dgram(
        "/var/run/log"
        flags(syslog-protocol)
    );
};

# Log path for processing Caddy logs
# pull the raw caddy logs in, transform them, send them back to a unix socket
# that gets processed by the rest of the OPNsense syslog pipeline/framework
log {
    source(s_caddy);
    parser(p_caddy_levels);
    destination(d_local_caddy_feedback);
};
