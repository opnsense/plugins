{% set cfg = OPNsense.Yggdrasil.general %}
{% set peers = helpers.toList('OPNsense.Yggdrasil.general.Peers.Peer') %}
{% set listeners = helpers.toList('OPNsense.Yggdrasil.general.Listen.Listener') %}
{% set keys = helpers.toList('OPNsense.Yggdrasil.general.AllowedPublicKeys.AllowedPublickey') %}
{% set interface_peers = {} %}
{% for peer in helpers.toList('OPNsense.Yggdrasil.general.InterfacePeers.Peer') %}
{% do interface_peers.setdefault(peer.Interface, []).append(peer.URI) %}
{% endfor %}
{
    PrivateKey: {{ cfg.PrivateKey | tojson }}

    Peers: {{ peers | map(attribute='uri') | list | tojson }}

    InterfacePeers: {{ interface_peers | tojson }}

    Listen: {{ listeners | map(attribute='URI') | list | tojson }}

    AdminListen: "unix:///var/run/yggdrasil.sock"

    MulticastInterfaces: [
{% for interface in helpers.toList('OPNsense.Yggdrasil.general.MulticastInterfaces.Interface') %}
        {
            Regex: {{ interface.Regex | tojson }}
            Beacon: {{ 'true' if interface.Beacon == '1' else 'false' }}
            Listen: {{ 'true' if interface.Listen == '1' else 'false' }}
            Port: {{ interface.Port | int }}
            Password: {{ interface.Password | default('', true) | tojson }}
            Priority: {{ interface.Priority | int }}
        }
{% endfor %}
    ]

    AllowedPublicKeys: {{ keys | map(attribute='PublicKey') | list | tojson }}

{% if cfg.IfNameMode == 'custom' %}
    IfName: {{ cfg.IfNameCustom }}
{% else %}
    IfName: {{ cfg.IfNameMode }}
{% endif %}
    IfMTU: {{ cfg.IfMTU | int }}

{% if not helpers.empty('OPNsense.Yggdrasil.general.GroupPassword') %}
    GroupPassword: {{ cfg.GroupPassword | tojson }}
{% endif %}
    NodeInfoPrivacy: {{ 'true' if cfg.NodeInfoPrivacy == '1' else 'false' }}
    NodeInfo: {{ cfg.NodeInfo | default('{}', true) }}
}
