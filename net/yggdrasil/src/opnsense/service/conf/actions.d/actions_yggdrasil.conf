[start]
command:/usr/local/etc/rc.d/yggdrasil start
parameters:
type:script
message:Starting Yggdrasil service

[stop]
command:/usr/local/opnsense/scripts/OPNsense/Yggdrasil/stop.sh
parameters:
type:script
message:Stopping Yggdrasil service

[restart]
command:/usr/local/etc/rc.d/yggdrasil restart
parameters:
type:script
message:Restarting Yggdrasil service

[status]
command:/usr/local/etc/rc.d/yggdrasil status
errors:no
parameters:
type:script_output
message:Requesting Yggdrasil status

[genconf]
command:/usr/local/bin/yggdrasil -genconf -json
parameters:
type:script_output
message:Generating Yggdrasil configuration]

[setup]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Yggdrasil/setup.php
parameters:
type:script
message:Initializing Yggdrasil settings
