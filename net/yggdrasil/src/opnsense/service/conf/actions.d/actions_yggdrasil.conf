[start]
command:/usr/local/etc/rc.d/yggdrasil start
parameters:
type:script
message:Starting Yggdrasil service

[stop]
command:/usr/local/etc/rc.d/yggdrasil stop
parameters:
type:script
message:Stopping Yggdrasil service

[restart]
command:/usr/local/etc/rc.d/yggdrasil restart
parameters:
type:script
message:Restarting Yggdrasil service

[status]
command:/usr/local/etc/rc.d/yggdrasil status
errors:no
parameters:
type:script_output
message:Requesting Yggdrasil status
