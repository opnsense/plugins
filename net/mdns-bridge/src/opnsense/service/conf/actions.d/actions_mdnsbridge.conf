[start]
command:service mdns_bridge start
type:script
message:starting mdns_bridge

[stop]
command:service mdns_bridge stop
type:script
message:stopping mdns_bridge

[status]
command:service mdns_bridge status; true
type:script_output
message:mdns_bridge status

[restart]
command:service mdns_bridge restart
type:script
message:restarting mdns_bridge
