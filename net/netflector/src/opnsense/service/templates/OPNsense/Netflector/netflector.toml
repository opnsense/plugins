{% from 'OPNsense/Macros/interface.macro' import physical_interface %}
# Generated by the os-netflector plugin. Edits are lost the next time the configuration is applied.
log_level = "{{ OPNsense.Netflector.general.log_level|default('info') }}"
counters_interval_secs = {{ OPNsense.Netflector.general.counters_interval_secs|default('0') }}
{% if helpers.exists('OPNsense.Netflector.reflectors.reflector') %}
{%   for entry in helpers.toList('OPNsense.Netflector.reflectors.reflector') %}
{%     if entry.enabled|default('0') == '1' %}

{#     Every switch is written out, false and "default" included, so a later change to a daemon
       default cannot silently flip a plugin user. #}
[reflectors.{{ entry.name }}]
source_if = "{{ physical_interface(entry.source_if) }}"
target_if = "{{ physical_interface(entry.target_if) }}"
wol = {{ 'true' if entry.wol|default('0') == '1' else 'false' }}
{%       if entry.wol|default('0') == '1' and entry.wol_ports %}
wol_ports = [{{ entry.wol_ports.split(',') | join(', ') }}]
{%       endif %}
mdns = {{ 'true' if entry.mdns|default('0') == '1' else 'false' }}
ssdp = {{ 'true' if entry.ssdp|default('0') == '1' else 'false' }}
dial = {{ 'true' if entry.dial|default('0') == '1' else 'false' }}
wsd = {{ 'true' if entry.wsd|default('0') == '1' else 'false' }}
{%       if entry.macs %}
{#       The field keeps the spelling as typed; the daemon parses the colon form only. #}
macs = [{% for mac in entry.macs.split(',') %}{% set hex = mac|lower|replace(':', '')|replace('-', '')|replace('.', '') %}"{{ hex[0:2] }}:{{ hex[2:4] }}:{{ hex[4:6] }}:{{ hex[6:8] }}:{{ hex[8:10] }}:{{ hex[10:12] }}"{% if not loop.last %}, {% endif %}{% endfor %}]
{%       endif %}
address_family = "{{ entry.address_family|default('default') }}"
{%     endif %}
{%   endfor %}
{% endif %}
