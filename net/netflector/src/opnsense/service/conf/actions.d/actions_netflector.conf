[start]
command:/usr/local/etc/rc.d/netflector start
type:script
message:starting netflector

[stop]
command:/usr/local/etc/rc.d/netflector stop
type:script
message:stopping netflector

[restart]
command:/usr/local/etc/rc.d/netflector restart
type:script
message:restarting netflector

[status]
command:/usr/local/etc/rc.d/netflector status
errors:no
type:script_output
message:netflector status

[report]
command:/usr/local/etc/rc.d/netflector report
type:script
message:dumping netflector diagnostics to the log

; Renders the configuration the model would produce into a cache root instead of over the live file,
; so that validating it never costs the daemon its ability to restart. [check] reads what this wrote.
[stage]
command:template.reload
parameters:%s
type:inline
config:/conf/config.xml
root_dir:/var/cache/netflector
message:staging the netflector configuration

[check]
command:/usr/local/opnsense/scripts/netflector/check.sh
errors:no
type:script_output
message:validating the netflector configuration
